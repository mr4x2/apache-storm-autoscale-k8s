---
# Persistent Volume Claim
# storageClassName: standard works on both GKE (pd.csi.storage.gke.io) and
# kind (rancher.io/local-path) — no manual PV needed on either.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: storm-cluster
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 20Gi
