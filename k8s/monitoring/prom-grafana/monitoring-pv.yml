# GKE: no manual PVs needed — both PVCs below use storageClassName: standard which triggers
# GKE's pd.csi.storage.gke.io driver to provision Google Persistent Disks automatically.
# The hostPath PVs that were here (/mnt/gra-pv, /mnt/prom-pv) do not work on GKE.

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: storm-cluster
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: storm-cluster
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
